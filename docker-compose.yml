version: '3.8'
services:
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage:/var/www/backend/storage
    networks:
      - app-network

  vue-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue-app
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vue-app
      - laravel-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge