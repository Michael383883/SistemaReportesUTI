version: '3.8'
services:
  sqlserver-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "071.f03"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - ./data/sqlserver:/var/opt/mssql/data
      - ./openssl_legacy.cnf:/etc/ssl/openssl.cnf:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "SA",
             "-P", "UTIPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      retries: 10
      start_period: 30s

  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: always
    depends_on:
      sqlserver-db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage:/var/www/backend/storage
    networks:
      - app-network

  vue-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue-app
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:3003"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vue-app
      - laravel-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge