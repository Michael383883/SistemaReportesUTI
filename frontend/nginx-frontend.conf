server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME base + mapeo de .mjs para el worker de pdf.js.
    # IMPORTANTE: un bloque "types" a nivel server REEMPLAZA el del nivel
    # http (no se fusiona), por eso se re-incluye mime.types aquí mismo:
    # en el mismo nivel los bloques sí se acumulan. Sin este include,
    # html/js/css se sirven como application/octet-stream y el navegador
    # los descarga en vez de mostrarlos.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Vue Router modo history: redirige todo a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets compilados por Vite (tienen hash en el nombre).
    # try_files =404: si el hash es viejo y el archivo ya no existe,
    # devuelve 404 en vez de caer a index.html (que rompería el MIME
    # del módulo y daría "Failed to fetch dynamically imported module").
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin cache para index.html para que siempre cargue la versión nueva
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}